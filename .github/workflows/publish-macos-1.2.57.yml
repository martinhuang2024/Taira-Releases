name: Publish Taira macOS 1.2.57

on:
  push:
    branches: [update-feed]
    paths:
      - ".github/workflows/publish-macos-1.2.57.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified Taira 1.2.57 DMG
        shell: bash
        run: |
          set -euo pipefail
          URL="https://martinmacbook-air.tail39b2be.ts.net/taira-dmg-1257/Taira.dmg"
          rm -f Taira.dmg
          if ! curl -fL --retry 3 --retry-delay 2 "$URL" -o Taira.dmg; then
            rm -f Taira.dmg
            for IP in 103.84.155.217 103.84.155.153; do
              if curl -fL --retry 2 --retry-delay 2                 --resolve martinmacbook-air.tail39b2be.ts.net:443:$IP                 "$URL" -o Taira.dmg; then
                break
              fi
              rm -f Taira.dmg
            done
          fi
          test -f Taira.dmg
          echo "a4548e38f1150f248091a9e7e074ea6f4379610c0147b78ad068bb51a2d2c362  Taira.dmg" | sha256sum -c -
          test "$(stat -c%s Taira.dmg)" = "28178432"

      - name: Update README and Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail
          cat > appcast.xml <<'XML'
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Taira</title>
                  <item>
                      <title>1.2.57</title>
                      <pubDate>Mon, 05 Oct 2026 00:35:32 +0000</pubDate>
                      <sparkle:version>1.2.57</sparkle:version>
                      <sparkle:shortVersionString>1.2.57</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                      <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>
                      <enclosure url="https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg" length="28178432" type="application/octet-stream" sparkle:edSignature="8deGiZUPSPf8RusPj1f7QrUm7sF/tRbSfbfuwvMeohdTpa685J766OCGGtnUZ1xaJ8diiWSNHdmDkA2TpTNxBA=="/>
                  </item>
              </channel>
          </rss>
          XML

          cat > README.md <<'MD'
          # Taira Releases

          ## Windows

          [下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)

          目前版本: 1.2.34
          支援: Windows 11 x64

          ## macOS

          [下載 Taira.dmg](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg)

          目前版本: 1.2.57
          支援: macOS 12+ / Apple Silicon

          macOS 1.2.57 為 Bun runtime 修正版，已通過 packaged Host runtime smoke、完整 App 啟動、DMG 與 codesign 驗證。
          MD

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taira.dmg README.md appcast.xml
          git commit -m "release: Taira macOS 1.2.57"
          git push origin HEAD:main
