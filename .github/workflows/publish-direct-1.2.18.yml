name: Direct Publish Taira 1.2.18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-direct-1.2.18.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Windows MSI
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-ad30-8209-8ff6-fa37c936259a/raw?se=2026-09-30T21%3A30%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=2a789342-5e89-52cb-8fc4-5135188a86ad&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T20%3A55%3A24Z&ske=2026-10-01T20%3A55%3A24Z&sks=b&skv=2026-02-06&sig=pr7PbYpP2UQ7mmXFV0E5qVRnlFGf9DCdgukPNfgXd/0%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira-win.zip
          rm -rf /tmp/taira-win
          mkdir -p /tmp/taira-win
          unzip -q /tmp/taira-win.zip -d /tmp/taira-win
          MSI="$(find /tmp/taira-win -type f -name 'TairaSetup.msi' -print -quit)"
          test -n "$MSI"
          cp "$MSI" TairaSetup.msi

      - name: Fetch macOS DMG
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3bdc-8206-93b2-e0ab3df7147e/raw?se=2026-09-30T21%3A30%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=47d17ed4-b27d-5955-9f20-d87b4d22ca45&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T20%3A53%3A11Z&ske=2026-10-01T20%3A53%3A11Z&sks=b&skv=2026-02-06&sig=mliG81frCwbjNvJBMDoga2Lh88T3CQdn7JLEmZimB9M%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira-mac.zip
          rm -rf /tmp/taira-mac
          mkdir -p /tmp/taira-mac
          unzip -q /tmp/taira-mac.zip -d /tmp/taira-mac
          DMG="$(find /tmp/taira-mac -type f -name 'Taira.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" Taira.dmg

      - name: Update README
        run: |
          cat > README.md <<'EOF'
          # Taira Releases

          ## Windows 下載

          [下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)

          目前版本: `1.2.18`  
          支援: Windows 11 x64

          標準 Windows Installer (MSI)。

          ## macOS 下載

          [下載 Taira.dmg](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg)

          目前版本: `1.2.18`  
          支援: macOS 12+ / Apple Silicon

          安裝後由 Taira 內建 Sparkle 檢查與安裝更新。
          EOF

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TairaSetup.msi Taira.dmg
          git commit -m "chore: publish Taira 1.2.18 Windows and macOS"
          git push origin main
