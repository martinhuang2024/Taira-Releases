name: Publish fixed Taira DMG 1.2.55

on:
  push:
    branches: [update-feed]
    paths:
      - ".github/workflows/publish-dmg-1.2.55-fix.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download fixed signed DMG from build Mac
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            --resolve martinmacbook-air.tail39b2be.ts.net:443:103.84.155.153 \
            "https://martinmacbook-air.tail39b2be.ts.net/taira-dmg-1255-fix/Taira.dmg" \
            -o Taira.dmg
          echo "8cb35d1557f03421f35dccc07af874d556bac117022ce4190f90803e3e5963a0  Taira.dmg" | sha256sum -c -
          test "$(stat -c%s Taira.dmg)" = "28183040"

      - name: Publish DMG to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taira.dmg
          git commit -m "fix: repackage Taira 1.2.55 DMG for Sparkle"
          git push origin HEAD:main
