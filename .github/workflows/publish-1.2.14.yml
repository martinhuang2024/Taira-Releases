name: Publish Taira MSI 1.2.14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.2.14.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout releases repo
        uses: actions/checkout@v4

      - name: Download built MSI artifact
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2710-8209-a5f1-0882097af4b6/raw?se=2026-09-30T19%3A48%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=f3653d7a-f496-5488-b1b5-f251e862d81d&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T19%3A43%3A08Z&ske=2026-10-01T19%3A43%3A08Z&sks=b&skv=2026-02-06&sig=jwKQ3bOFSXeyRFsEwn/A3loXENCXvCGDRljjiDByGEU%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira-artifact.zip
          rm -rf /tmp/taira-artifact
          mkdir -p /tmp/taira-artifact
          unzip -q /tmp/taira-artifact.zip -d /tmp/taira-artifact
          MSI="$(find /tmp/taira-artifact -type f -name 'TairaSetup.msi' -print -quit)"
          test -n "$MSI"
          cp "$MSI" TairaSetup.msi

      - name: Update release metadata
        run: |
          printf '%s\n' \
            '# Taira Releases' \
            '' \
            '## Windows 下載' \
            '' \
            '[下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)' \
            '' \
            '目前版本: `1.2.14`  ' \
            '支援: Windows 11 x64' \
            '' \
            '標準 Windows Installer (MSI)，不再使用自解壓 EXE。' \
            > README.md

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TairaSetup.msi
          git commit -m "chore: publish Taira Windows MSI 1.2.14"
          git push origin main
