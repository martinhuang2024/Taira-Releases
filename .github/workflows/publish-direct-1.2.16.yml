name: Direct Publish Taira 1.2.16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-direct-1.2.16.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch built MSI
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d050-8206-b6bf-6747dabdb000/raw?se=2026-09-30T20%3A24%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=941801dd-44ef-5701-86c3-66461a833bb5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T20%3A16%3A33Z&ske=2026-10-01T20%3A16%3A33Z&sks=b&skv=2026-02-06&sig=GCgqQ0H8hfSAGQs0nrWLZx6X2fpPi0qK77Zu1IVEKzw%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira.zip
          rm -rf /tmp/taira-artifact
          mkdir -p /tmp/taira-artifact
          unzip -q /tmp/taira.zip -d /tmp/taira-artifact
          MSI="$(find /tmp/taira-artifact -type f -name 'TairaSetup.msi' -print -quit)"
          test -n "$MSI"
          cp "$MSI" TairaSetup.msi

      - name: Update version
        run: |
          printf '%s\n' \
            '# Taira Releases' \
            '' \
            '## Windows 下載' \
            '' \
            '[下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)' \
            '' \
            '目前版本: `1.2.16`  ' \
            '支援: Windows 11 x64' \
            '' \
            '標準 Windows Installer (MSI)，不再使用自解壓 EXE。' \
            > README.md

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TairaSetup.msi
          git commit -m "chore: publish Taira Windows MSI 1.2.16"
          git push origin main
