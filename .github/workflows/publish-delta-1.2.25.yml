name: Publish Taira 1.2.25 from delta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-delta-1.2.25.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd

      - name: Verify current 1.2.23 bases
        run: |
          set -euo pipefail
          echo "5bedc92061d6fc5b7ec2bfc18ef1adc6b1390c0d9fac11921780306876fafbbc  Taira.dmg" | sha256sum -c -
          echo "993d78256a6cd99738076d889a017b52ee1cdb0f5ce3426171f6e5640cac02a0  TairaSetup.msi" | sha256sum -c -

      - name: Reassemble delta patches
        run: |
          set -euo pipefail
          cat patches/1.2.25/dmg.part.* > /tmp/dmg.patch.zst
          cat patches/1.2.25/msi.part.* > /tmp/msi.patch.zst

      - name: Rebuild 1.2.25 binaries
        run: |
          set -euo pipefail
          zstd -d --patch-from=Taira.dmg /tmp/dmg.patch.zst -o /tmp/Taira-1.2.25.dmg
          zstd -d --patch-from=TairaSetup.msi /tmp/msi.patch.zst -o /tmp/TairaSetup-1.2.25.msi
          echo "68f77419892dc089f776a430912ce6491a0ed01d9ce446c5ef285e982d8c2c2f  /tmp/Taira-1.2.25.dmg" | sha256sum -c -
          echo "037b40e18c23bbcf8ba3210ec8ee7aa874b4755810c4f8aa906a8e94da2244f8  /tmp/TairaSetup-1.2.25.msi" | sha256sum -c -

      - name: Publish binaries
        run: |
          set -euo pipefail
          cp Taira.dmg Taira-1.2.23.dmg
          cp /tmp/Taira-1.2.25.dmg Taira.dmg
          cp /tmp/TairaSetup-1.2.25.msi TairaSetup.msi
          python3 - <<'PY'
          from pathlib import Path
          p=Path("appcast.xml")
          s=p.read_text()
          old="https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg"
          new="https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira-1.2.23.dmg"
          if "<sparkle:version>1.2.23</sparkle:version>" not in s:
              raise SystemExit("unexpected Sparkle version")
          if old not in s:
              raise SystemExit("expected old enclosure URL missing")
          p.write_text(s.replace(old,new,1))
          PY
          cat > README.md <<'EOF'
          # Taira Releases

          ## Windows 下載

          [下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)

          目前版本: `1.2.25`  
          支援: Windows 11 x64

          標準 Windows Installer (MSI)。

          ## macOS 下載

          [下載 Taira.dmg](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg)

          目前版本: `1.2.25`  
          支援: macOS 12+ / Apple Silicon

          安裝後由 Taira 內建 Sparkle 檢查與安裝更新。
          EOF

      - name: Commit release and cleanup
        run: |
          set -euo pipefail
          rm -rf patches/1.2.25
          rm .github/workflows/publish-delta-1.2.25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish Taira 1.2.25 Windows and macOS"
          git push origin main
