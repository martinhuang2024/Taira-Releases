name: Taira 1.2.58 Hotfix Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-1.2.58-hotfix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified 1.2.58 Bun Host
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            "https://martinmacbook-air.tail39b2be.ts.net:8443/TairaBunHost" \
            -o /tmp/TairaBunHost
          test "$(stat -f %z /tmp/TairaBunHost)" = "61667248"
          echo "7304d2e3500bd85571da2a3290069b11a4ecdc4c78270af07b5f7111b7b9b155  /tmp/TairaBunHost" | shasum -a 256 -c -
          chmod 755 /tmp/TairaBunHost

      - name: Assemble 1.2.58 app from public 1.2.57 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/taira-base
          hdiutil attach "$GITHUB_WORKSPACE/Taira.dmg" -nobrowse -readonly -mountpoint /tmp/taira-base
          test -d /tmp/taira-base/Taira.app
          ditto /tmp/taira-base/Taira.app /tmp/Taira.app
          hdiutil detach /tmp/taira-base

          BASE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/Taira.app/Contents/Info.plist)
          test "$BASE_VERSION" = "1.2.57"

          cp /tmp/TairaBunHost /tmp/Taira.app/Contents/Resources/TairaBunHost
          chmod 755 /tmp/Taira.app/Contents/Resources/TairaBunHost

          python3 - <<'PY'
          import json
          p = "/tmp/Taira.app/Contents/Resources/app/package.json"
          data = json.load(open(p))
          data["version"] = "1.2.58"
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.2.58' /tmp/Taira.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1.2.58' /tmp/Taira.app/Contents/Info.plist

          codesign --force --sign - --identifier com.taira.remote.bunhost \
            --requirements '=designated => identifier "com.taira.remote.bunhost"' \
            /tmp/Taira.app/Contents/Resources/TairaBunHost
          codesign --verify --strict /tmp/Taira.app/Contents/Resources/TairaBunHost

          codesign --force --sign - --identifier com.taira.remote \
            --requirements '=designated => identifier "com.taira.remote"' \
            /tmp/Taira.app
          codesign --verify --deep --strict /tmp/Taira.app

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/Taira.app/Contents/Info.plist)" = "1.2.58"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' /tmp/Taira.app/Contents/Info.plist)" = "https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/appcast.xml"

      - name: Smoke packaged Bun Host
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/taira-bun-smoke.log
          TAIRA_APP_ROOT="/tmp/Taira.app/Contents/Resources/app" \
          TAIRA_IP="127.0.0.1" \
          BIND="127.0.0.1" \
          PORT="28787" \
          TAIRA_REDIRECT_PORT="28788" \
          TAIRA_SERVE_PROXY_PORT="28789" \
          TAIRA_SERVE_BACKEND_PORT="28789" \
          TAIRA_SERVE_TARGET_PORT="28789" \
          TAIRA_HOST_ENGINE_ACTIVE="bun" \
          /tmp/Taira.app/Contents/Resources/TairaBunHost >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT

          ok=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$PID" >/dev/null 2>&1; then
              cat "$LOG"
              exit 1
            fi
            if HEALTH="$(curl -fsS --max-time 1 http://127.0.0.1:28787/api/health 2>/dev/null)"; then
              HEALTH_JSON="$HEALTH" python3 - <<'PY'
          import json, os
          p = json.loads(os.environ["HEALTH_JSON"])
          assert p.get("ok") is True, p
          assert p.get("version") == "1.2.58", p
          PY
              ok=1
              break
            fi
            sleep 0.25
          done
          test "$ok" = "1"

      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/taira-dmg-root /tmp/taira-verify
          mkdir -p /tmp/taira-dmg-root
          ditto /tmp/Taira.app /tmp/taira-dmg-root/Taira.app
          ln -s /Applications /tmp/taira-dmg-root/Applications
          hdiutil create -volname Taira -srcfolder /tmp/taira-dmg-root -ov -format UDZO /tmp/Taira-1.2.58.dmg

          mkdir -p /tmp/taira-verify
          hdiutil attach /tmp/Taira-1.2.58.dmg -nobrowse -readonly -mountpoint /tmp/taira-verify
          test -f /tmp/taira-verify/Taira.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/taira-verify/Taira.app/Contents/Info.plist)" = "1.2.58"
          codesign --verify --deep --strict /tmp/taira-verify/Taira.app
          hdiutil detach /tmp/taira-verify

          cp /tmp/Taira-1.2.58.dmg "$GITHUB_WORKSPACE/Taira.dmg"
          echo "DMG_SIZE=$(stat -f %z "$GITHUB_WORKSPACE/Taira.dmg")"
          echo "DMG_SHA256=$(shasum -a 256 "$GITHUB_WORKSPACE/Taira.dmg" | awk '{print $1}')"

      - name: Publish DMG only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Taira Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Taira.dmg
          git commit -m "release: publish macOS 1.2.58"
          git push origin HEAD:main
