name: Roll back macOS to 1.2.53

on:
  push:
    branches: [update-feed]
    paths:
      - ".github/workflows/rollback-macos-1.2.53.yml"

permissions:
  contents: write

jobs:
  rollback:
    runs-on: macos-latest
    steps:
      - name: Checkout current release main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore verified 1.2.53 app from immutable historical release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            "https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/ffb30e7b3f966cb530f31c9b2dd6d2476fd54d62/Taira.zip" \
            -o Taira-1.2.53.zip
          echo "b48daaa961cf8860ae0c2c660552d4266f6115354d5c83e483f817e5ff7ae871  Taira-1.2.53.zip" | shasum -a 256 -c -

          rm -rf rollback-root rollback-dmg
          mkdir -p rollback-root rollback-dmg
          ditto -x -k Taira-1.2.53.zip rollback-root

          APP="$(find rollback-root -maxdepth 2 -type d -name 'Taira.app' -print -quit)"
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.2.53"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.taira.remote"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist")" = "https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/appcast.xml"
          codesign --verify --deep --strict "$APP"

          ditto "$APP" rollback-dmg/Taira.app
          ln -s /Applications rollback-dmg/Applications
          hdiutil create -volname "Taira" -srcfolder rollback-dmg -ov -format UDZO Taira.dmg

          CHECK_MOUNT="$RUNNER_TEMP/taira-1253-check"
          mkdir -p "$CHECK_MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$CHECK_MOUNT" Taira.dmg >/dev/null
          trap 'hdiutil detach "$CHECK_MOUNT" >/dev/null 2>&1 || true' EXIT
          test -d "$CHECK_MOUNT/Taira.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$CHECK_MOUNT/Taira.app/Contents/Info.plist")" = "1.2.53"
          codesign --verify --deep --strict "$CHECK_MOUNT/Taira.app"
          hdiutil detach "$CHECK_MOUNT" >/dev/null
          trap - EXIT
          shasum -a 256 Taira.dmg

      - name: Restore 1.2.53 README and Sparkle feed
        shell: bash
        run: |
          set -euo pipefail
          cat > README.md <<'MD'
          # Taira Releases

          ## Windows

          [下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)

          目前版本: 1.2.34
          支援: Windows 11 x64

          ## macOS

          [下載 Taira.dmg](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg)

          目前版本: 1.2.53
          支援: macOS 12+ / Apple Silicon

          macOS 目前回滾至穩定版 1.2.53。
          MD

          cat > appcast.xml <<'XML'
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Taira</title>
                  <item>
                      <title>1.2.53</title>
                      <pubDate>Sun, 04 Oct 2026 14:11:36 +0000</pubDate>
                      <sparkle:version>1.2.53</sparkle:version>
                      <sparkle:shortVersionString>1.2.53</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                      <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>
                      <enclosure url="https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/ffb30e7b3f966cb530f31c9b2dd6d2476fd54d62/Taira.zip" length="43971129" type="application/octet-stream" sparkle:edSignature="BVnJeP4qDvUlTIWhT0edntiiP0DcH2iIASp/TPyxqzUwrw0IfValptqEEvq++PaTGlmYLwlknwLX8uSf5h0ZCw=="/>
                  </item>
              </channel>
          </rss>
          XML

      - name: Publish rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taira.dmg README.md appcast.xml
          git commit -m "rollback: macOS public release to Taira 1.2.53"
          git push origin HEAD:main
