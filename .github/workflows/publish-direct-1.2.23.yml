name: Direct Publish Taira 1.2.23

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-direct-1.2.23.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Windows MSI
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-92ec-8209-88b5-3b9672ac9a8b/raw?se=2026-09-30T22%3A37%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=9fb16973-eaf4-514b-aa82-64f7b088a610&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T21%3A56%3A37Z&ske=2026-10-01T21%3A56%3A37Z&sks=b&skv=2026-02-06&sig=Y0heCCmN8jTt6iBxSa21flAb91bl3G8XR6qH5dEy0mo%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira-win.zip
          rm -rf /tmp/taira-win
          mkdir -p /tmp/taira-win
          unzip -q /tmp/taira-win.zip -d /tmp/taira-win
          MSI="$(find /tmp/taira-win -type f -name 'TairaSetup.msi' -print -quit)"
          test -n "$MSI"
          cp "$MSI" TairaSetup.msi

      - name: Fetch macOS DMG
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-411c-8206-bb8b-ebaa111b331a/raw?se=2026-09-30T22%3A37%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=dfaac3d4-4e82-5fd7-b69b-707377296ede&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T19%3A08%3A40Z&ske=2026-10-01T19%3A08%3A40Z&sks=b&skv=2026-02-06&sig=Dl4Z5bOtIoTky9cSFDw3jB7oAwRrGSg4CzofFFCdW3A%3D"
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/taira-mac.zip
          rm -rf /tmp/taira-mac
          mkdir -p /tmp/taira-mac
          unzip -q /tmp/taira-mac.zip -d /tmp/taira-mac
          DMG="$(find /tmp/taira-mac -type f -name 'Taira.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" Taira.dmg
          test "$(stat -c%s Taira.dmg)" = "49241357"

      - name: Write Sparkle appcast
        run: |
          cat > appcast.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Taira Updates</title>
              <link>https://github.com/martinhuang2024/Taira-Releases</link>
              <description>Taira macOS updates</description>
              <language>zh-TW</language>

              <item>
                <title>Taira 1.2.23</title>
                <sparkle:version>1.2.23</sparkle:version>
                <sparkle:shortVersionString>1.2.23</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                <pubDate>Wed, 30 Sep 2026 22:22:07 +0000</pubDate>
                <enclosure
                  url="https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg"
                  sparkle:edSignature="ajCVWA6H6WT+4Xg/euxa/gLuKCHtOFOryFbiD4y1BzlG4K4U7Sji37hDBl5hyIDp9wZfNdo3OzE0UWu9JGSqBQ=="
                  length="49241357"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Update README
        run: |
          cat > README.md <<'EOF'
          # Taira Releases

          ## Windows 下載

          [下載 TairaSetup.msi](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/TairaSetup.msi)

          目前版本: `1.2.23`  
          支援: Windows 11 x64

          標準 Windows Installer (MSI)。

          ## macOS 下載

          [下載 Taira.dmg](https://raw.githubusercontent.com/martinhuang2024/Taira-Releases/main/Taira.dmg)

          目前版本: `1.2.23`  
          支援: macOS 12+ / Apple Silicon

          安裝後由 Taira 內建 Sparkle 檢查與安裝更新。
          EOF

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TairaSetup.msi Taira.dmg appcast.xml
          git commit -m "chore: publish Taira 1.2.23 Windows and macOS"
          git push origin main
